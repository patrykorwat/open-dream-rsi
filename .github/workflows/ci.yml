name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # pipefail is set explicitly: without it the step's exit code is that
      # of `tail`, and a failing suite would show a green check.
      - name: Fast subset (sub-minute signal)
        run: |
          set -o pipefail
          python scripts/fast_tests.py 2>&1 | tail -20
      - name: Full stdlib-only test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tail -20

  lint:
    name: Lint + vendored-copy drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (correctness rules, pinned version)
        run: |
          set -o pipefail
          python -m pip install ruff==0.17.1
          ruff check --select E9,F63,F7,F82,F401,F841 open_dream_rsi plugins examples scripts tests
      - name: Vendored npm bundle copy matches open_dream_rsi/
        run: python tests/test_vendored_drift.py -v
      - name: Release version sync
        run: |
          set -o pipefail
          python scripts/check_versions.py
      - name: Typecheck (mypy, clean gate)
        run: |
          set -o pipefail
          python -m pip install mypy==2.4.0
          mypy open_dream_rsi/ --ignore-missing-imports > /tmp/mypy.log 2>&1 || true
          N=$(grep -c ': error:' /tmp/mypy.log || true)
          echo "mypy errors: $N (py.typed promise — the tree must typecheck clean)"
          [ "$N" -eq 0 ]
          python tests/test_typecheck_pin.py

  smoke:
    name: Key-free smoke (fresh clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Demo runs with no install and no API key
        run: python examples/live_loop_demo.py
      - name: Deterministic benchmark runs key-free
        run: python -m open_dream_rsi bench --cycles 3 --markdown

  package:
    name: Wheel build + clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and install it
        run: |
          set -o pipefail
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Import and version probe from outside the checkout
        run: |
          cd /
          python -c "import open_dream_rsi; print('import OK, version', open_dream_rsi.__version__)"
          python -c "import pathlib, open_dream_rsi; p = pathlib.Path(open_dream_rsi.__file__).parent / 'py.typed'; assert p.exists(), f'{p} missing from the wheel'"
          python -m open_dream_rsi --version

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (pip install inside, non-root user)
        run: |
          set -o pipefail
          docker build -t open-dream-rsi:ci .
      - name: Docker smoke (version and status)
        run: |
          set -o pipefail
          docker run --rm open-dream-rsi:ci --version
          docker run --rm open-dream-rsi:ci status
