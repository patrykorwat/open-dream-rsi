# dsh-open-dream-rsi bundle layer: the ODR (open-dream-rsi) MCP server over
# stdio behind DSH's first-party bridge. Tools appear as
# mcp__open_dream_rsi__<tool>.
#
# Paths default to the directory `dsh` was launched from (tasks.json and
# .dream_rsi beside it). Override this row from your profile's
# cordis.patch.yml (same id; a config override replaces the whole config).
- insert:
    - id: mcp-open-dream-rsi
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: open_dream_rsi
        transport: stdio
        command: python3
        args:
          - '-m'
          - 'open_dream_rsi'
          - 'mcp'
          - '--tasks'
          - !!js process.getBuiltinModule('node:path').join(process.cwd(), 'tasks.json')
          - '--memory'
          - !!js process.getBuiltinModule('node:path').join(process.cwd(), '.dream_rsi')
        env:
          # DSH scrubs the spawned child's environment (names matching
          # KEY|PASSWORD|SECRET|TOKEN and all DSH_*); re-pass the LLM
          # resolution vars explicitly. Without them the dreamer falls back
          # to http://127.0.0.1:8000/v1 with model auto-detection.
          OPENAI_BASE_URL: !!js process.env.OPENAI_BASE_URL || ''
          OPENAI_API_KEY: !!js process.env.OPENAI_API_KEY || ''
          ODR_LLM_MODEL: !!js process.env.ODR_LLM_MODEL || ''
          ODR_LLM_PRESET: !!js process.env.ODR_LLM_PRESET || ''
          # Running from a checkout (no pip install): the outer shell's
          # PYTHONPATH pointing at the open-dream-rsi repo survives here.
          PYTHONPATH: !!js process.env.PYTHONPATH || ''
        cwd: !!js process.cwd()
        # ODR improvement cycles (odr_run_once, odr_dream) run for many
        # minutes — the 60 s default per-call timeout would kill them
        # mid-cycle. 30 min covers a budget-100 cycle with headroom.
        toolCallTimeoutMs: 1800000
