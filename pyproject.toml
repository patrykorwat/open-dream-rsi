[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-dream-rsi"
version = "0.3.12"
description = "Open-source implementation of the Dream-RSI (Recursive Self-Improvement through Evolving Worlds) architecture."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "patrykorwat" }]
keywords = ["llm", "agents", "self-improvement", "offline-rl", "dreamer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/patrykorwat/open-dream-rsi"
Repository = "https://github.com/patrykorwat/open-dream-rsi"

[project.scripts]
odr = "open_dream_rsi.cli:main"

[tool.setuptools.packages.find]
include = ["open_dream_rsi*"]

[tool.setuptools.package-data]
open_dream_rsi = ["py.typed"]
